<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вчасно.ТТН · JSON генератор</title>
<style>
:root{
  color-scheme:dark;
  --brand:#B9A6FF;        /* світло-фіолетовий акцент — змінюється тут */
  --brand-ink:#1A1433;    /* текст на фіолетовому */
  --bg:#121214;
  --surface:#1B1B1F;
  --surface-2:#232329;
  --line:#2E2E36;
  --line-strong:#3D3D48;
  --text:#ECECF1;
  --muted:#9C9CAD;
  --accent:#B9A6FF;
  --danger:#F5A9C8;      /* світло-рожевий для обов'язкових/помилок */
  --ok:#9BE7C0;
  --focus:rgba(185,166,255,.35);
  --code-bg:#0E0E11;
  --code-text:#E6E6EE;
  --code-key:#C9B8FF;
  --code-str:#9FE2A0;
  --code-num:#8AB4F8;
  --code-lit:#F28B82;
  --radius:12px;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:0 20px;height:56px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.logo small{font-weight:500;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{white-space:nowrap;border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.active{background:var(--brand);color:var(--brand-ink)}
.tab[disabled]{cursor:not-allowed;opacity:.55}
.tab .soon{font-size:10px;font-weight:600;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.topbar .spacer{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--line-strong)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(360px,40%);gap:0;height:calc(100vh - 56px)}
.nav{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 10px}
.nav h6{margin:6px 10px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--surface-2)}
.nav a.active{background:var(--surface-2);font-weight:600}
.nav a .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
.nav a.filled .dot{background:var(--ok)}
.nav a.missing .dot{background:var(--danger)}
.nav a .req{margin-left:auto;font-size:11px;color:var(--danger)}

.main{overflow:auto;padding:20px 24px 80px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--muted);font-weight:500;margin-left:auto}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;transition:.15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{left:16px}
.search{flex:0 1 240px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* ---------- sections ---------- */
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);scroll-margin-top:12px}
.section>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px}
.section>summary::-webkit-details-marker{display:none}
.section>summary .chev{transition:transform .15s;color:var(--muted)}
.section[open]>summary .chev{transform:rotate(90deg)}
.section h3{margin:0;font-size:15px}
.section>summary,.group>summary,.arr-head{flex-wrap:wrap;min-width:0}
.section .key,.arr-head .key{overflow-wrap:anywhere;min-width:0}
.section .key{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--muted)}
.section .badge{margin-left:auto}
.section-body{padding:4px 18px 18px;border-top:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 14px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.field label .k{overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:400;color:var(--muted);font-size:11px}
.star{color:var(--danger)}
.guess{font-size:10px;padding:0 5px;border-radius:4px;background:rgba(185,166,255,.15);color:#C9B8FF;border:1px solid rgba(185,166,255,.4);cursor:help}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:none;min-height:36px}
.field textarea{resize:vertical;min-height:60px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus)}
.field.invalid input,.field.invalid select{border-color:var(--danger)}
.field .const{padding:8px 10px;border:1px dashed var(--line-strong);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--muted);background:var(--surface-2)}
.hint{font-size:11px;color:var(--muted)}

.group{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.group>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.group>summary::-webkit-details-marker{display:none}
.group>summary .chev{transition:transform .15s;color:var(--muted);font-size:11px}
.group[open]>summary .chev{transform:rotate(90deg)}
.group>.grid{padding:0 14px 14px;margin-top:0}
.group .group{background:var(--surface)}

.note-card{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);min-width:0}
.note-card .field input{background:var(--surface)}
.note-more>summary{list-style:none;cursor:pointer;font-size:11px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;user-select:none}
.note-more>summary::-webkit-details-marker{display:none}
.note-more>summary:hover{color:var(--accent)}
.note-more>summary .chev{font-size:9px;transition:transform .15s}
.note-more[open]>summary .chev{transform:rotate(90deg)}
.note-more>.grid{grid-template-columns:1fr;margin-top:8px}

.arr{grid-column:1/-1}
.arr-head{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.arr-head .t{font-weight:600;font-size:13px}
.arr-item{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:10px}
.arr-item-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.arr-item-head .n{font-weight:700;font-size:12px;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 8px}
.arr-item-head .spacer{flex:1}
.arr-item>.grid{padding:0 12px 12px}
.arr-item .variant{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:36px}
.chips:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 8px;font-size:12px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 3px}
.chips input{border:0!important;box-shadow:none!important;flex:1;min-width:90px;min-height:24px!important;padding:2px 4px!important}
.kv-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px}
.empty-arr{font-size:12px;color:var(--muted);padding:2px 0 6px}

.hidden-opt .field.opt,.hidden-opt .group.opt,.hidden-opt .arr.opt,.hidden-opt .note-card.opt{display:none}
.search-miss{display:none!important}

/* ---------- preview ---------- */
.preview{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.preview-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.preview-head .t{font-weight:700}
.preview-head .spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-weight:600;font-size:12px}
.pill.ok{background:rgba(155,231,192,.12);color:var(--ok)}
.pill.warn{background:rgba(245,169,200,.14);color:var(--danger);cursor:pointer}
.pill.info{background:var(--surface-2);color:var(--muted)}
.missing-list{display:none;max-height:180px;overflow:auto;border-bottom:1px solid var(--line);padding:6px 14px;font-size:12px}
.missing-list.open{display:block}
.missing-list a{display:block;padding:3px 0;color:var(--danger);text-decoration:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}
.missing-list a:hover{text-decoration:underline}
pre.json:focus{outline:2px solid var(--brand);outline-offset:-2px}
pre.json{flex:1;margin:0;overflow:auto;padding:16px 18px;background:var(--code-bg);color:var(--code-text);font:12.5px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:2}
.ln{display:inline-block;min-width:100%;border-radius:4px;transition:background .4s}
.ln.hl{background:rgba(185,166,255,.18)}
.j-k{color:var(--code-key)}.j-s{color:var(--code-str)}.j-n{color:var(--code-num)}.j-l{color:var(--code-lit)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:none}}

@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr);height:auto}
  .nav{display:none}
  .preview{border-left:0;border-top:1px solid var(--line);height:70vh}
  .main{overflow:visible}
}
@media (max-width:600px){
  .topbar{gap:10px;padding:0 12px}
  .logo small{display:none}
  .tab[disabled]{display:none}
  .layout,.main,.preview{max-width:100vw}
  .main{padding:16px 16px 60px}
}

/* ============================================================
   Тема «Алюміній + клавіші» (2026-10-02): сірий фон, поля — чорні як клавіатура.
   Панель JSON праворуч має власні токени і не змінюється.
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#A4A7AC;
  --surface:#979A9F;      /* «дека» під полями */
  --surface-2:#8C8F94;    /* вкладені блоки */
  --line:rgba(0,0,0,.14);
  --line-strong:rgba(0,0,0,.26);
  --text:#141518;
  --muted:#3C3E44;
  --accent:#4B3A9E;
  --danger:#8C1D52;       /* приглушений малиновий — читається на сірому */
  --ok:#1F7A4D;
  --focus:rgba(185,166,255,.55);
  --key:#1B1C1F;          /* клавіша */
  --key-hover:#222327;
  --key-text:#ECECEE;
  --key-muted:#8E9096;
  --key-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 #0B0B0D,0 3px 6px rgba(0,0,0,.22);
}
body{background:linear-gradient(180deg,#AEB1B6 0%,#A2A5AA 45%,#999CA1 100%) fixed;color:var(--text)}

/* панель JSON — старі темні токени */
.preview{
  color-scheme:dark;color:#ECECF1;
  --surface:#1B1B1F;--surface-2:#232329;--line:#2E2E36;--line-strong:#3D3D48;
  --text:#ECECF1;--muted:#9C9CAD;--danger:#F5A9C8;--ok:#9BE7C0;--accent:#B9A6FF;--focus:rgba(185,166,255,.35);
}

/* шапка й меню */
.topbar{background:rgba(180,183,188,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.14)}
.topbar .logo small{color:var(--muted)}
.topbar .tab{color:#2E3035}
.topbar .tab:hover{background:rgba(0,0,0,.08);color:var(--text)}
.topbar .tab.active{background:var(--brand);color:var(--brand-ink);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.topbar .tab .soon{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.12);color:var(--muted)}
.nav{background:rgba(160,163,168,.55);border-right:1px solid rgba(0,0,0,.12)}
.nav a{color:var(--text)}
.nav a:hover{background:rgba(0,0,0,.07)}
.nav a.active{background:rgba(0,0,0,.11)}
.nav a .dot{background:rgba(0,0,0,.25)}

/* кнопки й поля — «клавіші» */
.main .btn,.main .search{background:var(--key);color:var(--key-text);border:0;box-shadow:var(--key-shadow)}
.main .btn:hover{background:var(--key-hover)}
.main .btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 #0B0B0D}
.main .btn.primary{background:var(--brand);color:var(--brand-ink)}
.main .btn.ghost{background:transparent;box-shadow:none;color:var(--text)}
.main .btn.ghost:hover{background:rgba(0,0,0,.08)}
.main .btn.danger{color:var(--danger)}
.main .search::placeholder{color:var(--key-muted)}
.main .switch{color:var(--text)}
.main .switch input{background:var(--key);box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}

.main .field input,.main .field select,.main .field textarea,.main .chips,.main .arr-item .variant{
  background:var(--key);color:var(--key-text);border:1px solid #0E0E10;box-shadow:var(--key-shadow);color-scheme:dark}
.main .field input::placeholder,.main .field textarea::placeholder{color:var(--key-muted)}
.main .field input:focus,.main .field select:focus,.main .field textarea:focus,.main .chips:focus-within{
  border-color:var(--brand);box-shadow:0 0 0 3px var(--focus),var(--key-shadow)}
.main .note-card .field input{background:var(--key)}
.main .chips input{background:transparent!important;box-shadow:none!important;border:0!important}
.main .chip{background:#2C2D32;border-color:#3A3B41;color:var(--key-text)}
.main .chip button{color:var(--key-muted)}
.main .field .const{background:#2A2B2F;color:#B4B6BC;border:1px dashed rgba(255,255,255,.14)}

/* блоки */
.main .section{background:var(--surface);border:1px solid rgba(0,0,0,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.08)}
.main .section-body{border-top:1px solid rgba(0,0,0,.12)}
.main .group,.main .note-card,.main .arr-item{background:var(--surface-2);border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.main .group .group{background:#93969B}
.main .arr-item-head{border-bottom:1px solid rgba(0,0,0,.12)}
.main .guess{background:rgba(75,58,158,.14);color:#3B2C85;border-color:rgba(75,58,158,.35)}
.main .note-more>summary:hover{color:var(--accent)}

/* ============================================================
   Глибина «як в iOS» (2026-10-02): блоки з полями «плавають» над фоном.
   ============================================================ */
.main{
  background:
    radial-gradient(900px 520px at 12% 8%, rgba(255,255,255,.28), transparent 60%),
    radial-gradient(700px 480px at 88% 30%, rgba(185,166,255,.16), transparent 62%),
    radial-gradient(800px 600px at 30% 95%, rgba(0,0,0,.10), transparent 60%),
    linear-gradient(180deg,#A9ACB1,#9A9DA2);
  background-attachment:fixed;
}
.main .section{
  background:rgba(150,153,158,.62);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid rgba(255,255,255,.28);
  border-radius:18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.42),
    0 1px 2px rgba(0,0,0,.10),
    0 8px 18px -6px rgba(0,0,0,.22),
    0 22px 44px -18px rgba(0,0,0,.30);
  margin-bottom:20px;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s ease,box-shadow .25s ease;
  will-change:transform;
}
.main .section:hover{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.48),
    0 2px 4px rgba(0,0,0,.10),
    0 12px 24px -8px rgba(0,0,0,.26),
    0 30px 56px -20px rgba(0,0,0,.34);
}
.main .section-body{border-top:1px solid rgba(255,255,255,.18)}
.main .group,.main .note-card,.main .arr-item{
  border-radius:14px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(130,133,138,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 10px -6px rgba(0,0,0,.25);
}
.main .group .group{background:rgba(120,123,128,.5)}
.main .field input,.main .field select,.main .field textarea,.main .chips{border-radius:10px}

/* поява блоків при прокрутці */
.main .section.rise{opacity:0;transform:translateY(22px) scale(.985)}
@media (prefers-reduced-motion:reduce){
  .main .section,.main .section.rise{transition:none;opacity:1;transform:none}
}
@media (max-width:1100px){ .main{background-attachment:scroll}}

/* ============================================================
   «Вода на ч/б фото» (2026-10-02): світліший сріблясто-сірий фон
   з м'якими відблисками-брижами. Панель JSON не чіпаємо.
   ============================================================ */
:root{ --bg:#C6C8CB; --surface:rgba(176,179,183,.52); --surface-2:rgba(150,153,158,.42); }
body{background:linear-gradient(180deg,#D3D5D8 0%,#C5C7CA 50%,#B9BBBF 100%) fixed}
.topbar{background:rgba(212,214,217,.86)}
.nav{background:rgba(196,198,201,.6)}
.main{
  background:

/* Поле-примітка IncludeNote: ContentCode в один рядок, решта — під «ще» */
function isNote(s){ s = resolve(s); return s && s.properties && s.properties.ContentCode && s.properties.SubjectCode; }

function renderProp(key, ps, path, required, depth){
  const s = resolve(ps);
  const optCls = required ? '' : ' opt';
  const searchText = (key + ' ' + (s.description || '')).toLowerCase();

  if (s.freeform){
    return el('div', { class: 'field' + optCls, style: 'grid-column:1/-1', 'data-search': searchText },
      labelFor(key, s, required, s.guessed), kvFor(path));
  }
  if (isNote(ps)){
    const inner = resolve(ps);
    const contentS = Object.assign({}, inner.properties.ContentCode, { description: '' });
    const moreBody = el('div', { class: 'grid' },
      renderProp('Content', inner.properties.Content, path.concat('Content'), false, depth + 1),
      renderProp('SubjectCode', inner.properties.SubjectCode, path.concat('SubjectCode'), false, depth + 1));
    const filledMore = !isEmpty(getAt(path.concat('Content'))) || !isEmpty(getAt(path.concat('SubjectCode')));
    return el('div', { class: 'note-card' + optCls, 'data-search': searchText },
      el('div', { class: 'field' }, labelFor(key, s, required, s.guessed), inputFor('ContentCode', contentS, path.concat('ContentCode'))),
      el('details', { class: 'note-more', open: filledMore },
        el('summary', { title: 'Необов\'язкові підполя IncludeNote' }, el('span', { class: 'chev' }, '▶'), 'Content, SubjectCode'), moreBody));
  }
  if (s.properties){
    const open = required || build(s, getAt(path), false) !== undefined;
    const det = el('details', { class: 'group' + optCls, open: open, 'data-search': searchText },
      el('summary', {}, el('span', { class: 'chev' }, '▶'), s.description || key,
        required ? el('span', { class: 'star' }, '*') : null,
        el('span', { class: 'key', style: 'font-weight:400' }, key)),
      renderObject(s, path, depth + 1));
    return det;
  }
  if (s.type === 'array' || s.items){
    const items = resolve(s.items || {});
    if (!s.items || (!isObj(s.items) && !s.items.anyOf)){
      return el('div', { class: 'field' + optCls, style: 'grid-column:1/-1', 'data-search': searchText },
        labelFor(key, s, required, s.guessed), chipsFor(path), el('span', { class: 'hint' }, 'Список значень'));
    }
    return renderArray(key, s, path, required, depth);
  }
  return el('div', { class: 'field' + optCls, 'data-search': searchText },
    labelFor(key, s, required, s.guessed), inputFor(key, s, path),
    s.format === 'date-time' ? el('span', { class: 'hint' }, 'ISO 8601, з часовим поясом') : null);
}

function renderObject(s, path, depth){
  const grid = el('div', { class: 'grid' });
  const req = s.required || [];
  // спочатку прості поля, потім вкладені блоки
  const entries = Object.entries(s.properties);
  const simple = entries.filter(([, ps]) => { const r = resolve(ps); return !r.properties && !(r.items && (isObj(r.items) || r.items.anyOf)) && !r.freeform && !(r.type === 'array' && !r.items); });
  const complex = entries.filter(e => !simple.includes(e));
  const order = [...simple.filter(([k]) => req.includes(k)), ...simple.filter(([k]) => !req.includes(k)),
                 ...complex.filter(([k]) => req.includes(k)), ...complex.filter(([k]) => !req.includes(k))];
  for (const [k, ps] of order) grid.append(renderProp(k, ps, path.concat(k), req.includes(k), depth));
  return grid;
}

function renderArray(key, s, path, required, depth){
  const box = el('div', { class: 'arr' + (required ? '' : ' opt'), 'data-search': (key + ' ' + (s.description || '')).toLowerCase() });
  const list = el('div', {});

  const itemSchema = variants ? null : resolve(s.items);

  const draw = () => {
    list.innerHTML = '';

    arr.forEach((it, i) => {

          variants.map(v => el('option', { value: v, selected: v === cur }, variantLabel(v))));
        body = renderObject(resolve({ $ref: cur }), ipath, depth + 1);
      } else body = renderObject(itemSchema, ipath, depth + 1);
      if (seqKey){ const si = body.querySelector(`[data-path="${CSS.escape(pathStr(ipath.concat(seqKey)))}"]`); if (si) si.placeholder = 'авто: ' + (i + 1); }
      list.append(el('div', { class: 'arr-item' },

          el('button', { type: 'button', class: 'btn sm ghost', title: 'Дублювати', onclick: () => { const a = (getAt(path) || []).slice(); const copy = JSON.parse(JSON.stringify(a[i])); if (seqKey) delete copy[seqKey]; a.splice(i + 1, 0, copy); setAt(path, a); renumber(); draw(); update(); } }, '⧉'),
          el('button', { type: 'button', class: 'btn sm ghost danger', title: 'Видалити', onclick: () => { const a = (getAt(path) || []).slice(); a.splice(i, 1); setAt(path, a.length ? a : undefined); renumber(); draw(); update(); } }, '✕')),
        body));
    });
  };
  const renumber = () => {};
  const add = () => {
    const a = (getAt(path) || []).slice();
    const item = variants ? { __variant: variants[0] } : {};
    a.push(item); setAt(path, a); draw(); update();
  };
  box.append(
    el('div', { class: 'arr-head' }, el('span', { class: 't' }, s.description || key), required ? el('span', { class: 'star' }, '*') : null,
      el('span', { class: 'key' }, key), el('span', { style: 'flex:1' }),
      el('button', { type: 'button', class: 'btn sm', onclick: add }, '+ Додати')),
    list);
  box._redraw = draw;
  draw();
  return box;
}
function variantLabel(ref){
  return ({ DigitalReferencedDocumentSchemaBase: 'Електронний документ (uid файлу)', ReferencedDocumentSchema: 'Документ (реквізити)' })[ref] || ref;
}

    ThirdParties: 'Інші учасники', TransportEquipmentTruck: 'Автомобіль', TransportEquipmentTrailer: 'Причепи', TransportEquipmentContainer: 'Контейнери',
    CarrierAcceptanceLogisticsLocation: 'Пункт навантаження', ConsigneeReceiptLogisticsLocation: 'Пункт розвантаження',
    MainCarriageLogisticsTransportMovement: 'Маршрут (проміжні пункти)', DeliveryInstructions: 'Вид перевезення',
    SupplyChainItems: 'Вантаж (товари)', AssociatedReferencedDocument: 'Супровідні документи',
    PickUpTransportEvent: 'Навантажувальні роботи', DeliveryTransportEvent: 'Розвантажувальні роботи'
  };
  const order = ['ConsignorTradeParty','ConsigneeTradeParty','CarrierTradeParty','CustomerTradeParty','TransportEquipmentTruck','TransportEquipmentTrailer','TransportEquipmentContainer',
    'CarrierAcceptanceLogisticsLocation','ConsigneeReceiptLogisticsLocation','SupplyChainItems','ForwarderTradeParty','TransitWHTradeParty','GuardTradeParty','ThirdParties',
    'DeliveryInstructions','AssociatedReferencedDocument','MainCarriageLogisticsTransportMovement','PickUpTransportEvent','DeliveryTransportEvent'];
  const keys = Object.keys(ssc.properties).filter(k => !(k in sscSimple.properties));
  keys.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));

      schema: ssc.properties[k], path: ['SpecifiedSupplyChainConsignment', k], required: (ssc.required || []).includes(k) });

/* ---------- output ---------- */
const out = $('#out');
function highlight(json){
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g, (m, str, colon, lit) => {
      if (str) return colon ? `<span class="j-k">${str}</span>${colon}` : `<span class="j-s">${str}</span>`;
      if (lit) return `<span class="j-l">${m}</span>`;
      return `<span class="j-n">${m}</span>`;
    });
}
let lastJson = '';
let lineMap = {};
function pretty(v){
  const lines = []; const map = {};
  const walk = (val, path, ind, prefix, comma) => {
    const pad = '  '.repeat(ind);
    map[pathStr(path)] = lines.length;
    if (val && typeof val === 'object'){
      const isArr = Array.isArray(val);
      const ks = isArr ? val.map((_, i) => i) : Object.keys(val);
      if (!ks.length){ lines.push(pad + prefix + (isArr ? '[]' : '{}') + comma); return; }
      lines.push(pad + prefix + (isArr ? '[' : '{'));
      ks.forEach((k, i) => walk(val[k], path.concat(k), ind + 1, isArr ? '' : JSON.stringify(k) + ': ', i < ks.length - 1 ? ',' : ''));
      lines.push(pad + (isArr ? ']' : '}') + comma);
    } else lines.push(pad + prefix + JSON.stringify(val) + comma);
  };
  walk(v, [], 0, '', '');
  return { text: lines.join('\n'), lines, map };
}
function scrollToPath(){
  if (!lastPath) return;
  let p = lastPath.slice(), idx;
  while (p.length && (idx = lineMap[pathStr(p)]) === undefined) p.pop();
  if (idx === undefined) return;
  const ln = out.querySelector(`[data-ln="${idx}"]`); if (!ln) return;
  out.querySelectorAll('.ln.hl').forEach(n => n.classList.remove('hl'));
  ln.classList.add('hl');
  out.scrollTo({ top: ln.offsetTop - out.clientHeight / 2 + ln.offsetHeight / 2, behavior: 'smooth' });
}
function update(){
  const p = payload();
  const pr = pretty(p);
  lastJson = pr.text; lineMap = pr.map;
  out.innerHTML = pr.lines.map((l, i) => `<span class="ln" data-ln="${i}">${highlight(l)}</span>`).join('\n');
  scrollToPath();
  const missing = [];
  validate({ $ref: ROOT }, state, [], true, missing);
  const st = $('#status'), ml = $('#missingList');
  st.innerHTML = '';
  const bytes = new Blob([lastJson]).size;
  if (missing.length){
    st.append(el('span', { class: 'pill warn', title: 'Показати список', onclick: () => ml.classList.toggle('open') }, `Не заповнено обов'язкових: ${missing.length}`));
  } else st.append(el('span', { class: 'pill ok' }, "Усі обов'язкові поля заповнено"));
  st.append(el('span', { class: 'pill info' }, `${(bytes / 1024).toFixed(1)} KB`));
  ml.innerHTML = '';
  missing.forEach(p => ml.append(el('a', { onclick: () => focusPath(p) }, pathStr(p))));
  if (!missing.length) ml.classList.remove('open');
  // навігація: стан розділів
  for (const sec of SECTIONS){
    const a = nav.querySelector(`[data-sec="${sec.id}"]`); if (!a) continue;
    const prefix = pathStr(sec.path);
    const secMissing = sec.path.length ? missing.filter(m => {
      const s = pathStr(m);
      if (!s.startsWith(prefix)) return false;
      if (sec.id === 'sec-ssc') return m.length === 2 && sec.schema.properties[m[1]];
      return true;
    }).length : 0;
    const filled = sec.path.length && build(sec.schema, getAt(sec.path), false) !== undefined;
    a.classList.toggle('missing', secMissing > 0);
    a.classList.toggle('filled', !secMissing && !!filled);
    a.querySelector('.req').textContent = secMissing ? secMissing : '';
  }
  save();
}
function focusPath(p){
  const ps = pathStr(p);
  let node = form.querySelector(`[data-path="${CSS.escape(ps)}"]`);
  if (!node){
    // масив або блок — шукаємо найближчий батьківський елемент
    for (let i = p.length - 1; i > 0 && !node; i--){
      const sub = pathStr(p.slice(0, i));
      node = form.querySelector(`[data-path^="${CSS.escape(sub)}"]`);
    }
  }
  const sec = SECTIONS.find(s => ps.startsWith(pathStr(s.path)) && s.path.length) ;
  if (sec) document.getElementById(sec.id).open = true;
  if (node){
    let d = node.closest('details'); while (d){ d.open = true; d = d.parentElement.closest('details'); }
    const f = node.closest('.field') || node;
    f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    f.classList.remove('flash'); void f.offsetWidth; f.classList.add('flash');
    if (node.focus) setTimeout(() => node.focus({ preventScroll: true }), 300);
  } else if (sec) document.getElementById(sec.id).scrollIntoView({ behavior: 'smooth' });
}

function applySearch(){
  const q = $('#search').value.trim().toLowerCase();
  const nodes = form.querySelectorAll('[data-search]');
  nodes.forEach(n => n.classList.remove('search-miss'));
  form.querySelectorAll('.section').forEach(s => s.classList.remove('search-miss'));
  if (!q) return;
  // показуємо збіги та їхніх предків
  const hits = new Set();
  nodes.forEach(n => { if (n.dataset.search.includes(q)) { hits.add(n); let p = n.parentElement; while (p && p !== form){ hits.add(p); p = p.parentElement; } } });
  nodes.forEach(n => { const inHit = n.parentElement && n.parentElement.closest('[data-search]') && [...hits].some(h => h.dataset && h.dataset.search && h.dataset.search.includes(q) && h.contains(n)); if (!hits.has(n) && !inHit) n.classList.add('search-miss'); });
  form.querySelectorAll('.section').forEach(s => { if (!hits.has(s)) s.classList.add('search-miss'); else s.open = true; });
  form.querySelectorAll('details.group').forEach(d => { if (hits.has(d)) d.open = true; });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting){ nav.querySelectorAll('a').forEach(a => a.classList.toggle('active', a.dataset.sec === en.target.id)); } });
}, { root: document.querySelector('.main'), rootMargin: '0px 0px -70% 0px' });


/* поява блоків при прокрутці («плавають» над фоном) */
const riseIO = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting){ en.target.classList.remove('rise'); riseIO.unobserve(en.target); } });
}, { rootMargin: '0px 0px -6% 0px', threshold: 0.04 }) : null;
function armRise(){
  if (!riseIO || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const vh = window.innerHeight;
  form.querySelectorAll('.section').forEach(s => {
    if (s.getBoundingClientRect().top > vh * 0.9){ s.classList.add('rise'); riseIO.observe(s); }
  });
}

/* старт */
state = load() || { SpecifiedSupplyChainConsignment: { SupplyChainItems: [{}] } };
renderAll();
update();
</script>
</body>
